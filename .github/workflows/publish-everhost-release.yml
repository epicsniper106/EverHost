name: Publish EverHost release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="release-assets/${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}/RELEASE-NOTES.md"
          shopt -s nullglob
          assets=("${asset_dir}"/EverHost.*.jar)
          test "${#assets[@]}" -gt 0
          test -f "${notes}"
          test -f "${asset_dir}/SHA256SUMS.txt"
          (cd "${asset_dir}" && sha256sum --check SHA256SUMS.txt)
          for asset in "${assets[@]}"; do
            (cd "${asset_dir}" && sha256sum "$(basename "${asset}")") | grep -Fxf "${asset_dir}/SHA256SUMS.txt"
          done
          gh release create "${GITHUB_REF_NAME}" \
            "${assets[@]}" \
            "${asset_dir}/SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --latest \
            --title "EverHost 1.0 Release - ${version}" \
            --notes-file "${notes}"
