plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def targetJavaVersion = project.minecraft_version == "1.21.11" ? 21 : 17

sourceSets.main.java.srcDir '../everhost-routing-common/src/main/java'
sourceSets.main.java.srcDir project.minecraft_version == "1.21.11" ? 'src/mc12111/java' : 'src/mc1201/java'

repositories {
	maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/releases/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"everhost" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets.client.java.srcDir project.minecraft_version == "1.21.11" ? 'src/mc12111Client/java' : 'src/mc1201Client/java'

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	def updateRepository = project.findProperty("update_repository") ?: ""
	def minecraftDependency = project.minecraft_version == "1.21.11" ? "~1.21.11" : "~1.20.1"
	def javaDependency = project.minecraft_version == "1.21.11" ? ">=21" : ">=17"
	def fabricApiDependency = ">=${project.fabric_api_version}"
	def updateAsset = project.minecraft_version == "1.21.11"
		? "EverHost.2.2.Fabric.1.21.11.Full.jar"
		: "EverHost.2.2.Fabric.1.20.1.jar"
	inputs.property "updateRepository", updateRepository
	inputs.property "updateAsset", updateAsset
	inputs.property "minecraftDependency", minecraftDependency
	inputs.property "javaDependency", javaDependency
	inputs.property "fabricApiDependency", fabricApiDependency
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_dependency": minecraftDependency,
			"java_dependency": javaDependency, "fabric_api_dependency": fabricApiDependency
	}
	filesMatching("everhost-update.properties") {
		expand "version": project.version, "minecraft": project.minecraft_version,
			"repository": updateRepository, "asset": updateAsset
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = targetJavaVersion
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	archiveBaseName = project.archives_base_name
	from("LICENSE") { rename { "${it}_${project.name}" } }
}
